# Every value comes from the environment; there are no defaults for credentials.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# schema is created and updated by Hibernate; add Flyway before running this anywhere that matters
spring.jpa.hibernate.ddl-auto=update

app.security.demo=false
# the gateway's issuer; tokens must carry "email" and a "roles" list
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI}
