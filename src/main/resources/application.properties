spring.application.name=org-management-service

# Run with the demo profile for in-memory H2, sample data and persona switching
# through the X-Demo-User header, or with prod for Postgres and real JWTs.
# With neither, the service expects JWTs and has no database: it fails closed.

server.port=8082

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.uploads.dir=${UPLOADS_DIR:uploads}

app.finance.currency=TRY
app.security.admin-role=${ADMIN_ROLE:ORG-ADMIN}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}

springdoc.swagger-ui.path=/swagger-ui.html
spring.jackson.serialization.write-dates-as-timestamps=false
spring.main.banner-mode=off
